<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレカレ">
<meta name="theme-color" content="#0F1115">
<title>トレーダーカレンダー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root, [data-theme="dark"]{
  --bg:#0F1115; --surf:#151820; --card:#1B1F29; --line:#232833; --line2:#3A4150; --chip:#1F2430;
  --text:#E8EAED; --mute:#9AA0A6; --dim:#4B5260; --inv:#0F1115;
  --hol:#F87171; --holbg:#1A1215; --holline:#4A2328; --holtext:#FCA5A5;
  --boj:#F59E0B; --ind:#60A5FA; --cb:#C084FC; --sat:#60A5FA; --acc:#60A5FA; --selbg:#232A38; --star:#FCD34D;
  --font:-apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; --r:10px;
}
[data-theme="light"]{
  --bg:#F6F7F9; --surf:#EEF0F3; --card:#FFFFFF; --line:#E3E6EB; --line2:#C9CED6; --chip:#FFFFFF;
  --text:#1A1D24; --mute:#5F6670; --dim:#B4BAC3; --inv:#FFFFFF;
  --hol:#D32F2F; --holbg:#FDECEC; --holline:#F5C2C2; --holtext:#C62828;
  --boj:#D97706; --ind:#2563EB; --cb:#9333EA; --sat:#2563EB; --acc:#2563EB; --selbg:#E8F0FE; --star:#B45309;
}
[data-theme="pink"]{
  --bg:#FFF5F8; --surf:#FDEBF1; --card:#FFFFFF; --line:#F8DDE7; --line2:#F2C6D6; --chip:#FFFFFF;
  --text:#4A2C3A; --mute:#86586C; --dim:#D9BCC8; --inv:#FFFFFF;
  --hol:#D6336C; --holbg:#FFE4EC; --holline:#F7B8CC; --holtext:#C2255C;
  --boj:#E8790C; --ind:#4F6FD8; --cb:#A66CE0; --sat:#4F6FD8; --acc:#D6336C; --selbg:#FFE0EC; --star:#C2410C;
  --font:"Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", -apple-system, sans-serif; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font-family:inherit;color:inherit;cursor:pointer}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.hdr h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px}
.ib{width:44px;height:44px;border:none;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;border-radius:22px}
.ib:active{background:var(--chip)}
.tag{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:3px 6px}
.sec{padding:0 14px 10px}
.lbl{font-size:12px;color:var(--mute);font-weight:600;margin:4px 0 6px}
.next{margin:0 14px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center}
.next .cd{font-size:20px;font-weight:700;color:var(--star);font-variant-numeric:tabular-nums;white-space:nowrap}
.hband{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hband::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto;background:var(--holbg);border:1px solid var(--holline);border-radius:var(--r);padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.hchip b{font-size:13px;color:var(--holtext)}
.cc{font-size:10px;font-weight:700;color:var(--inv);background:var(--holtext);border-radius:4px;padding:1px 4px;margin-left:5px}
.hchip span{font-size:11px;color:var(--text);white-space:nowrap;opacity:.85}
.empty{font-size:12px;color:var(--mute);padding:6px 0}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:0 8px}
.wk span{text-align:center;font-size:11px;color:var(--mute);padding-bottom:4px}
.wk span:first-child{color:var(--hol)} .wk span:last-child{color:var(--sat)}
.cell{height:58px;border-radius:var(--r);border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:5px}
.cell .n{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;padding:0 6px;border-radius:10px}
.cell.out .n{color:var(--dim)} .cell.sun .n,.cell.hd .n{color:var(--hol)} .cell.sat .n{color:var(--sat)}
.cell.hd{background:var(--holbg)}
.cell.today .n{background:var(--text);color:var(--inv);font-weight:700}
.cell.sel{border-color:var(--acc);background:var(--selbg)}
.cell .f{font-size:9px;font-weight:700;color:var(--holtext);height:11px;line-height:11px}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.sheet{margin-top:10px;background:var(--surf);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px 10px;min-height:220px}
.sheet h2,.h2{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.sheet h2 small,.h2 small{font-size:12px;color:var(--mute);font-weight:400}
.ev{display:flex;gap:10px;background:var(--card);border-radius:var(--r);padding:9px 10px;margin-bottom:6px;align-items:stretch}
.ev .bar{width:3px;border-radius:2px;flex:0 0 auto}
.ev .t{width:46px;flex:0 0 auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.ev .b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .b b{font-size:13.5px;font-weight:600;line-height:1.35}
.ev .b span{font-size:11px;color:var(--mute)}
.ev .s{flex:0 0 auto;font-size:11px;color:var(--star);letter-spacing:1px;padding-top:2px}
.ev.past{opacity:.45}
.ev.hol{background:var(--holbg);border:1px solid var(--holline)}
.day{font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
.day.hd{color:var(--hol)}
.day:first-child{margin-top:4px}
.big{margin:0 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.big .k{font-size:12px;color:var(--mute)}
.big .v{font-size:40px;font-weight:800;margin:4px 0;color:var(--boj);font-variant-numeric:tabular-nums}
.big .d{font-size:14px;font-weight:600}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 12px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.row label{flex:1;display:flex;align-items:center;gap:10px;min-height:48px}
.sw{width:10px;height:10px;border-radius:5px;display:inline-block}
.seg{display:flex;gap:4px}
.seg button{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--text);color:var(--inv);border-color:var(--text);font-weight:700}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.th{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px;align-items:stretch}
.th.on{border:2px solid var(--acc);font-weight:700}
.th .pv{height:52px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 8px}
.th .pv u{height:6px;width:70%;border-radius:3px;display:block}
.th .pv em{display:flex;gap:4px}
.th .pv em i{width:8px;height:8px;border-radius:4px;display:block}
.note{font-size:11px;color:var(--mute);line-height:1.6;padding:0 2px 16px}
nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{height:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--mute)}
nav button.on{color:var(--text)}
nav svg{width:22px;height:22px}
</style>
</head>
<body>
<main id="main"></main>
<nav id="nav">
  <button data-v="month" aria-label="月表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>月</button>
  <button data-v="list" aria-label="予定リスト"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg>リスト</button>
  <button data-v="boj" aria-label="日銀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10M19 21V10M9 21v-7M15 21v-7M2 10l10-6 10 6"/></svg>日銀</button>
  <button data-v="set" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</button>
</nav>
<script src="data.js"></script>
<script src="boj_auto.js" onerror="void 0"></script>
<script>
(function(){
"use strict";
var CAT = { boj:"日銀", ind:"経済指標", cb:"FOMC", hol:"休場" };
var CC = { JP:"日本", US:"米国", UK:"英国" };
var BOJSUB = { mpm:"決定会合・総裁会見", gov:"総裁・副総裁の講演・挨拶", member:"審議委員の講演・挨拶・会見", doc:"主な意見・議事要旨" };
var WD = ["日","月","火","水","木","金","土"];
var DEF = { theme:"dark", cc:{JP:true,US:true,UK:true}, cat:{boj:true,ind:true,cb:true,hol:true}, boj:{mpm:true,gov:true,member:true,doc:true}, star:1 };

function load(){ try{ var s = JSON.parse(localStorage.getItem("tcal") || "null"); if(s){ return { theme:s.theme||DEF.theme, cc:Object.assign({},DEF.cc,s.cc), cat:Object.assign({},DEF.cat,s.cat), boj:Object.assign({},DEF.boj,s.boj), star:s.star||1 }; } }catch(e){} return JSON.parse(JSON.stringify(DEF)); }
function save(){ try{ localStorage.setItem("tcal", JSON.stringify(S)); }catch(e){} }
var S = load();

// ---- 日付ユーティリティ（日本時間基準） ----
function pad(n){ return (n<10?"0":"")+n; }
function ymd(y,m,d){ return y+"-"+pad(m)+"-"+pad(d); }
function jstNow(){ var t = new Date(Date.now() + 9*3600e3); return { y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate(), ms:Date.now() }; }
function dow(s){ var p = s.split("-"); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay(); }
function nthSunday(y,m,n){ var d = new Date(Date.UTC(y,m-1,1)); var first = (7 - d.getUTCDay()) % 7 + 1; return first + (n-1)*7; }
function usDST(y,m,d){ var s = nthSunday(y,3,2), e = nthSunday(y,11,1); var k = m*100+d; return k >= 300+s && k < 1100+e; }
// ET or JST の日時 → { date(JST), time(JST), ms }
function toJst(date, time, tz){
  var p = date.split("-"), y=+p[0], m=+p[1], d=+p[2];
  if(!time){ return { date:date, time:null, ms:Date.UTC(y,m-1,d,0,0) - 9*3600e3 }; }
  var q = time.split(":"), hh=+q[0], mi=+q[1];
  var off = tz === "ET" ? (usDST(y,m,d) ? -4 : -5) : 9;
  var ms = Date.UTC(y,m-1,d,hh,mi) - off*3600e3;
  var j = new Date(ms + 9*3600e3);
  return { date: ymd(j.getUTCFullYear(), j.getUTCMonth()+1, j.getUTCDate()), time: pad(j.getUTCHours())+":"+pad(j.getUTCMinutes()), ms: ms };
}

// ---- データ正規化 ----
var ALL = [];
var SEEN = {};
(window.TCAL_EVENTS||[]).concat(window.TCAL_BOJ_AUTO||[]).forEach(function(e){
  var key = e[0]+"|"+e[5]; if(SEEN[key]) return; SEEN[key] = 1;
  var j = toJst(e[0], e[1], e[2]);
  ALL.push({ date:j.date, time:j.time, ms:j.ms, allDay:!e[1], cat:e[3], cc:e[4], title:e[5], sub:e[6]||"", star:e[7]||1, sub2:e[8]||null });
});
var HOL = {};
(window.TCAL_HOLIDAYS||[]).forEach(function(h){
  var kind = h[3] || "close";
  var title = (kind==="half" ? CC[h[0]]+" 短縮取引" : kind==="bond" ? CC[h[0]]+" 債券市場のみ休場" : CC[h[0]]+" 休場") + "（" + h[2] + "）";
  var sub = kind==="half" ? "13:00 ET 引け（日本時間 翌3:00）" : kind==="bond" ? "株式は通常取引" : (h[0]==="JP" ? "東証 休業日" : h[0]==="US" ? "NYSE・Nasdaq" : "ロンドン市場");
  var j = toJst(h[1], null, "JST");
  var o = { date:h[1], time:null, ms:j.ms, allDay:true, cat:"hol", cc:h[0], title:title, sub:sub, star: kind==="close"?3:2, kind:kind, name:h[2] };
  ALL.push(o);
  (HOL[h[1]] = HOL[h[1]] || []).push(o);
});
ALL.sort(function(a,b){ return a.ms - b.ms || (a.allDay?-1:1); });

function visible(e){
  if(!S.cat[e.cat]) return false;
  if(!S.cc[e.cc]) return false;
  if(e.star < S.star) return false;
  if(e.cat === "boj" && e.sub2 && !S.boj[e.sub2]) return false;
  return true;
}
function evOn(date){ return ALL.filter(function(e){ return e.date === date && visible(e); }); }
function holOn(date){ return (HOL[date]||[]).filter(function(h){ return S.cat.hol && S.cc[h.cc]; }); }
function stars(n){ return "★★★".slice(0,n) + "☆☆☆".slice(0,3-n); }
function color(cat){ return "var(--"+cat+")"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function md(s){ var p = s.split("-"); return (+p[1])+"/"+(+p[2]); }
function label(s){ return (+s.split("-")[1])+"月"+(+s.split("-")[2])+"日（"+WD[dow(s)]+"）"; }

function evHtml(e, now){
  var past = !e.allDay && e.ms < now;
  if(e.cat === "hol") return '<div class="ev hol"><div class="bar" style="background:var(--hol)"></div><div class="t">終日</div><div class="b"><b style="color:var(--holtext)">'+esc(e.title)+'</b><span>'+esc(e.sub)+'</span></div></div>';
  return '<div class="ev'+(past?' past':'')+'"><div class="bar" style="background:'+color(e.cat)+'"></div><div class="t">'+(e.time||"未定")+'</div><div class="b"><b>'+esc(e.title)+'</b><span>'+esc(CAT[e.cat]+(e.sub?" ・ "+e.sub:""))+'</span></div><div class="s">'+stars(e.star)+'</div></div>';
}

// ---- 画面状態 ----
var T = jstNow();
var V = { view:"month", y:T.y, m:T.m, sel:ymd(T.y,T.m,T.d) };

function nextBig(){
  var now = Date.now();
  for(var i=0;i<ALL.length;i++){ var e = ALL[i]; if(!e.allDay && e.star===3 && e.ms > now && visible(e)) return e; }
  return null;
}
function cd(ms){
  var s = Math.max(0, Math.floor((ms - Date.now())/1000));
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d>0 ? d+"日 " : "") + pad(h)+":"+pad(m);
}

function renderMonth(){
  var now = Date.now(), t = jstNow(), today = ymd(t.y,t.m,t.d);
  var y = V.y, m = V.m;
  var first = new Date(Date.UTC(y,m-1,1)).getUTCDay();
  var days = new Date(Date.UTC(y,m,0)).getUTCDate();
  var prefix = ymd(y,m,1).slice(0,8);
  // 休場帯
  var hs = [];
  for(var d=1; d<=days; d++){ holOn(ymd(y,m,d)).forEach(function(h){ hs.push(h); }); }
  var band = hs.length ? hs.map(function(h){ return '<div class="hchip"><div><b>'+md(h.date)+'（'+WD[dow(h.date)]+'）</b><span class="cc">'+h.cc+'</span></div><span>'+esc(h.name)+(h.kind==="half"?" 短縮":h.kind==="bond"?" 債券のみ":"")+'</span></div>'; }).join("") : '<div class="empty">今月の休場はありません</div>';
  // 次の★3
  var nb = nextBig();
  var nx = nb ? '<div class="next"><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--mute)">次の★3</div><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(nb.title)+'</div><div style="font-size:11px;color:var(--mute)">'+label(nb.date)+' '+nb.time+'</div></div><div class="cd" id="cd" data-ms="'+nb.ms+'">'+cd(nb.ms)+'</div></div>' : '';
  // グリッド
  var cells = "";
  var total = Math.ceil((first+days)/7)*7;
  for(var i=0;i<total;i++){
    var dn = i - first + 1;
    if(dn < 1 || dn > days){ cells += '<div class="cell out"></div>'; continue; }
    var ds = ymd(y,m,dn), w = i%7;
    var hl = holOn(ds), evs = evOn(ds).filter(function(e){ return e.cat!=="hol"; });
    var cats = {}; evs.forEach(function(e){ cats[e.cat]=1; });
    var dots = Object.keys(cats).map(function(c){ return '<i style="background:'+color(c)+'"></i>'; }).join("");
    var cls = "cell"+(w===0?" sun":"")+(w===6?" sat":"")+(hl.length?" hd":"")+(ds===today?" today":"")+(ds===V.sel?" sel":"");
    var flag = hl.map(function(h){ return h.cc; }).filter(function(v,k,a){ return a.indexOf(v)===k; }).join("·");
    cells += '<button class="'+cls+'" data-d="'+ds+'" aria-label="'+label(ds)+'"><span class="n">'+dn+'</span><span class="f">'+flag+'</span><span class="dots">'+dots+'</span></button>';
  }
  // 選択日
  var list = evOn(V.sel);
  var body = list.length ? list.map(function(e){ return evHtml(e, now); }).join("") : '<div class="empty">予定はありません</div>';
  return '<div class="hdr"><div style="display:flex;align-items:center"><button class="ib" id="pm" aria-label="前の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><h1>'+y+'年'+m+'月</h1><button class="ib" id="nm" aria-label="次の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div><button class="tag" id="today" style="background:transparent;height:30px">今日</button></div>'
    + nx
    + '<div class="sec"><div class="lbl">今月の休場・短縮</div><div class="hband">'+band+'</div></div>'
    + '<div class="wk">'+WD.map(function(w){ return '<span>'+w+'</span>'; }).join("")+'</div>'
    + '<div class="grid">'+cells+'</div>'
    + '<div class="sheet"><h2>'+label(V.sel)+(V.sel===today?' 今日':'')+'<small>'+list.length+'件</small></h2>'+body+'</div>';
}

function renderList(){
  var now = Date.now(), t = jstNow();
  var start = Date.UTC(t.y,t.m-1,t.d), out = "";
  for(var i=0;i<21;i++){
    var dt = new Date(start + i*86400e3), ds = ymd(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate());
    var evs = evOn(ds); if(!evs.length) continue;
    var hd = holOn(ds).length > 0;
    out += '<div class="day'+(hd?' hd':'')+'">'+label(ds)+(i===0?' 今日':i===1?' 明日':'')+'</div>' + evs.map(function(e){ return evHtml(e, now); }).join("");
  }
  return '<div class="hdr"><h1 style="padding-left:4px">これから3週間</h1><span class="tag">日本時間</span></div><div class="sec">'+(out||'<div class="empty">予定はありません</div>')+'</div>';
}

function renderBoj(){
  var now = Date.now();
  var mtg = ALL.filter(function(e){ return e.cat==="boj" && e.sub2==="mpm" && /結果公表/.test(e.title) && e.ms + 86400e3 > now; })[0];
  var big = "";
  if(mtg){
    var t = jstNow(), a = Date.UTC(t.y,t.m-1,t.d), p = mtg.date.split("-"), b = Date.UTC(+p[0],+p[1]-1,+p[2]);
    var days = Math.round((b-a)/86400e3);
    big = '<div class="big"><div class="k">次回 金融政策決定会合 結果公表まで</div><div class="v">'+(days<=0?'本日':days+'<span style="font-size:18px;font-weight:700"> 日</span>')+'</div><div class="d">'+label(mtg.date)+'</div></div>';
  }
  var ups = ALL.filter(function(e){ return e.cat==="boj" && (!e.sub2 || S.boj[e.sub2]) && (e.allDay ? e.ms + 86400e3 > now : e.ms > now - 3600e3); }).slice(0,40);
  var out = "", last = "";
  ups.forEach(function(e){ var mk = e.date.slice(0,7); if(mk!==last){ out += '<div class="day">'+(+mk.slice(0,4))+'年'+(+mk.slice(5))+'月</div>'; last = mk; } out += evHtml(Object.assign({}, e, { title: md(e.date)+'（'+WD[dow(e.date)]+'） '+e.title }), now); });
  return '<div class="hdr"><h1 style="padding-left:4px">日銀</h1><span class="tag">講演・会合・公表物</span></div>' + big + '<div class="sec">'+(out||'<div class="empty">予定はありません</div>')+'</div>';
}

function renderSet(){
  var TH = [ ["dark","ダーク","#0F1115","#E8EAED",["#F59E0B","#60A5FA","#C084FC"]], ["light","ライト","#F6F7F9","#1A1D24",["#D97706","#2563EB","#9333EA"]], ["pink","ピンク","#FFF5F8","#4A2C3A",["#E8790C","#4F6FD8","#A66CE0"]] ];
  var th = TH.map(function(t){ return '<button class="th'+(S.theme===t[0]?' on':'')+'" data-th="'+t[0]+'" aria-pressed="'+(S.theme===t[0])+'"><span class="pv" style="background:'+t[2]+'"><u style="background:'+t[3]+'"></u><em>'+t[4].map(function(c){ return '<i style="background:'+c+'"></i>'; }).join("")+'</em></span>'+t[1]+'</button>'; }).join("");
  function chk(group, key, text, sw){ return '<div class="row"><label><input type="checkbox" data-g="'+group+'" data-k="'+key+'"'+(S[group][key]?' checked':'')+'>'+(sw?'<span class="sw" style="background:'+sw+'"></span>':'')+text+'</label></div>'; }
  return '<div class="hdr"><h1 style="padding-left:4px">設定</h1></div><div class="sec">'
    + '<div class="lbl">テーマ</div><div class="themes">'+th+'</div>'
    + '<div class="lbl">表示する国・市場</div><div class="grp">'+Object.keys(CC).map(function(k){ return chk("cc",k,CC[k]); }).join("")+'</div>'
    + '<div class="lbl">カテゴリ</div><div class="grp">'+Object.keys(CAT).map(function(k){ return chk("cat",k,CAT[k],color(k)); }).join("")+'</div>'
    + '<div class="lbl">日銀の表示項目</div><div class="grp">'+Object.keys(BOJSUB).map(function(k){ return chk("boj",k,BOJSUB[k]); }).join("")+'</div>'
    + '<div class="lbl">表示する重要度</div><div class="grp"><div class="row"><span>この重要度以上を表示</span><div class="seg">'+[1,2,3].map(function(n){ return '<button data-star="'+n+'" class="'+(S.star===n?'on':'')+'">★'+n+(n<3?'〜':'')+'</button>'; }).join("")+'</div></div></div>'
    + '<div class="note">時刻はすべて日本時間（米国の夏時間は自動で反映）。<br>データ更新日：'+esc(window.TCAL_UPDATED||"")+(window.TCAL_BOJ_AUTO_UPDATED?'<br>日銀講演予定の自動取得：'+esc(window.TCAL_BOJ_AUTO_UPDATED):'')+'<br>出典：JPX、NYSE、GOV.UK、日本銀行、FRB、米労働統計局（BLS）。日銀の講演予定は日銀HPの公表予定（毎週金曜更新）にもとづきます。予定は変更されることがあるため、重要な判断の前には各公式サイトで確認してください。</div></div>';
}

var main = document.getElementById("main");
function render(keepScroll){
  document.documentElement.setAttribute("data-theme", S.theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#0F1115");
  var top = main.scrollTop;
  main.innerHTML = V.view==="month" ? renderMonth() : V.view==="list" ? renderList() : V.view==="boj" ? renderBoj() : renderSet();
  if(keepScroll) main.scrollTop = top; else main.scrollTop = 0;
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){ b.classList.toggle("on", b.getAttribute("data-v")===V.view); });
}

main.addEventListener("click", function(ev){
  var el = ev.target.closest("button"); if(!el) return;
  if(el.id==="pm"){ V.m--; if(V.m<1){ V.m=12; V.y--; } render(); return; }
  if(el.id==="nm"){ V.m++; if(V.m>12){ V.m=1; V.y++; } render(); return; }
  if(el.id==="today"){ var t=jstNow(); V.y=t.y; V.m=t.m; V.sel=ymd(t.y,t.m,t.d); render(); return; }
  if(el.dataset.d){ V.sel = el.dataset.d; render(true); return; }
  if(el.dataset.th){ S.theme = el.dataset.th; save(); render(true); return; }
  if(el.dataset.star){ S.star = +el.dataset.star; save(); render(true); return; }
});
main.addEventListener("change", function(ev){
  var el = ev.target; if(el.dataset && el.dataset.g){ S[el.dataset.g][el.dataset.k] = el.checked; save(); render(true); }
});
document.getElementById("nav").addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if(!b) return; V.view = b.getAttribute("data-v"); render();
});
setInterval(function(){ var c = document.getElementById("cd"); if(c) c.textContent = cd(+c.dataset.ms); }, 15000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) render(true); });
render();

if("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self){
  try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
}
})();
</script>
</body>
</html>
